<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的智能记账本</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 引入分离的 CSS -->
    <link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#007aff">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="container">

    <!-- 顶部状态栏 -->
    <div class="top-bar">
        <div id="userStatus" class="user-status" onclick="toggleAuthModal()">
            <span class="status-dot"></span> 未登录 (本地模式)
        </div>
    </div>

    <!-- 第一部分：月度总览 -->
    <div class="card">
        <div class="month-selector">
            <select id="yearSelect" onchange="loadMonthData()"></select>
            <span>年</span>
            <select id="monthSelect" onchange="loadMonthData()"></select>
            <span>月</span>
        </div>
        
        <table class="overview-table">
            <tr>
                <td>收入总额</td>
                <td><input type="text" id="totalIncome" readonly placeholder="0"></td>
                <td>上月结转</td>
                <td id="lastMonthRollover">0</td>
            </tr>
            <tr>
                <td>支出总额</td>
                <td id="totalExpense" class="highlight">0</td>
                <td>本月结余</td>
                <td id="netIncome">0</td>
            </tr>
        </table>
    </div>

    <!-- 第二部分：极简收入明细 -->
    <div class="card">
        <h2>收入明细</h2>
        <div class="flex-row">
            <input type="text" id="inputIncomeCategory" placeholder="收入类别 (如: 工资)">
            <input type="date" id="inputIncomeDate">
            <input type="number" id="inputIncomeAmount" placeholder="金额">
        </div>
        <div class="flex-row">
            <input type="text" id="inputIncomeNote" placeholder="备注 (选填)">
            <button class="btn" style="width: 80px; margin-top:0; background: #2ed573;" onclick="addIncomeRecord()">添加</button>
        </div>
        <table style="margin-top: 10px;">
            <thead>
                <tr>
                    <th>类别</th>
                    <th>日期</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="incomeRecordBody"></tbody>
        </table>
    </div>

    <!-- 第三部分：预算分类 -->
    <div class="card">
        <h2>
            <span>支出预算分类</span>
            <div style="display: flex; align-items: center;">
                <div class="budget-tags">
                    <span class="budget-sum-tag" id="totalBudgetDisplay">总预算: 0</span>
                    <span class="budget-remain-tag" id="totalRemainDisplay">总剩余: 0</span>
                </div>
                <button class="btn btn-success btn-sm" onclick="addCategory()">+ 添加分类</button>
            </div>
        </h2>
        <table id="budgetTable">
            <thead>
                <tr>
                    <th>分类</th>
                    <th>预算金额</th>
                    <th>已支出</th>
                    <th>预算剩余</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="budgetBody"></tbody>
        </table>
    </div>

    <!-- 图表区 -->
    <div class="card">
        <h2>支出比例</h2>
        <div id="chart"></div>
    </div>

    <!-- 第四部分：支出记账明细 -->
    <div class="card">
        <h2>支出记账明细</h2>
        <div class="flex-row">
            <select id="inputCategory"></select>
            <input type="date" id="inputDate">
            <input type="number" id="inputAmount" placeholder="金额">
        </div>
        <div class="flex-row">
            <input type="text" id="inputNote" placeholder="备注 (如: 衣服、买菜)">
            <button class="btn" style="width: 80px; margin-top:0;" onclick="addRecord()">添加</button>
        </div>
        <div class="filter-bar">
            <span>查看分类：</span>
            <select id="filterCategory" onchange="renderRecords()">
                <option value="全部">全部明细</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>分类</th>
                    <th>日期</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordBody"></tbody>
        </table>
    </div>

    <!-- 第五部分：数据备份与恢复 -->
    <div class="backup-card">
        <h2 style="border-left-color: #ff9f43; margin-bottom: 15px;">数据备份与恢复 (本地)</h2>
        <div class="backup-btns">
            <button class="btn" style="background: #1e90ff;" onclick="exportData()">📥 导出备份</button>
            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📤 导入恢复</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

</div>

<!-- 登录/注册悬浮窗 (遮罩层) -->
<div class="modal-overlay" id="authModal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleAuthModal()">&times;</span>
        <h3 id="modalTitle">登录云端账号</h3>
        <p class="modal-desc">登录后，您的数据将自动同步到云端</p>
        
        <input type="email" id="authEmail" placeholder="请输入邮箱" class="auth-input">
        <input type="password" id="authPassword" placeholder="请输入密码 (至少6位)" class="auth-input">
        
        <button class="btn primary-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">登 录</button>
        
        <div class="auth-switch">
            <span id="switchText">还没有账号？</span>
            <a href="javascript:void(0)" id="switchBtn" onclick="switchAuthMode()">去注册</a>
        </div>
        
        <div id="authError" class="auth-error"></div>
    </div>
</div>

<!-- 引入分离的 JS -->
<script src="app.js"></script>
</body>
</html>
